<a class="skip-link" href="#contenido">Saltar al contenido</a>
<aside class="sidebar" aria-label="Panel del conductor">
  <a class="brand" routerLink="/conductor/rutas" queryParamsHandling="merge"><img src="assets/uniride/brand-dot.svg" alt="" />UniRide</a>
  <p class="panel-label">Panel del conductor</p>
  <mat-nav-list aria-label="Navegación principal">
    @for (item of menu; track item.icono) {
      @if (item.ruta) {
        <a
          mat-list-item
          [routerLink]="item.ruta"
          queryParamsHandling="merge"
          routerLinkActive="active"
          #rla="routerLinkActive"
          [attr.aria-current]="rla.isActive ? 'page' : null"
        >
          <img matListItemIcon [src]="'assets/uniride/' + item.icono + '.svg'" alt="" />
          <span matListItemTitle>{{ item.nombre }}</span>
        </a>
      } @else {
        <mat-list-item disabled [title]="item.nombre + ': módulo de otro integrante'">
          <img matListItemIcon [src]="'assets/uniride/' + item.icono + '.svg'" alt="" />
          <span matListItemTitle>{{ item.nombre }}</span>
        </mat-list-item>
      }
    }
  </mat-nav-list>
  <div class="sidebar-user"><span class="avatar">JP</span><div>Juan Pérez<small>CONDUCTOR</small></div></div>
</aside>
<mat-toolbar class="mobile-toolbar">
  <a class="brand" routerLink="/conductor/rutas">
    <img src="assets/uniride/brand-dot.svg" alt="" />UniRide
  </a>
  <span class="role-label">Conductor</span>
  <button matButton="text" [matMenuTriggerFor]="mobileMenu" aria-label="Abrir navegación">Menú</button>
</mat-toolbar>
<mat-menu #mobileMenu="matMenu" aria-label="Navegación móvil">
  @for (item of menu; track item.icono) {
    @if (item.ruta) { <a mat-menu-item [routerLink]="item.ruta">{{ item.nombre }}</a> }
  }
</mat-menu>
<main class="workspace" id="contenido"><router-outlet /></main>
