<div class="dialog-icon" aria-hidden="true">
  <mat-icon fontSet="material-symbols-outlined">delete</mat-icon>
</div>

<h2 mat-dialog-title>Eliminar método</h2>

<mat-dialog-content>
  <p>¿Deseas eliminar este método de compensación?</p>
  <p class="method-summary">
    <strong>{{ typeLabel }}</strong>
    <span>{{ method.descripcion }}</span>
  </p>
  <p class="ur-caption">
    Esta confirmación es una demostración visual. No se eliminará información del servidor.
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" (click)="cancel()">Cancelar</button>
  <button class="destructive-button" mat-flat-button type="button" (click)="confirm()">
    Eliminar método
  </button>
</mat-dialog-actions>
