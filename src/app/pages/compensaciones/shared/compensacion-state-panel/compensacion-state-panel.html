<section class="state-panel" [class]="'state-panel state-panel--' + tone()" role="status">
  <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">{{ icon() }}</mat-icon>
  <div class="state-panel__content">
    <h2>{{ title() }}</h2>
    <p>{{ message() }}</p>
    @if (actionLabel()) {
      <button mat-stroked-button type="button" (click)="action.emit()">
        {{ actionLabel() }}
      </button>
    }
  </div>
</section>
