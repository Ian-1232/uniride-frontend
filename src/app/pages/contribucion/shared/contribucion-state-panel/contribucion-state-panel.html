<section
  class="state-panel"
  [class]="'state-panel state-panel--' + tone()"
  [attr.role]="tone() === 'danger' ? 'alert' : 'status'"
  [attr.aria-busy]="loading()"
>
  @if (loading()) {
    <mat-spinner diameter="36" aria-label="Cargando sugerencia" />
  } @else {
    <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">{{ icon() }}</mat-icon>
  }

  <div class="state-copy">
    <h2>{{ title() }}</h2>
    <p>{{ message() }}</p>

    @if (actionLabel()) {
      <button mat-stroked-button type="button" (click)="action.emit()">
        {{ actionLabel() }}
      </button>
    }
  </div>
</section>
