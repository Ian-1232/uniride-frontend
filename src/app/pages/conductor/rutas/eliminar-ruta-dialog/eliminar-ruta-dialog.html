<div class="dialog-icon" aria-hidden="true">
  <mat-icon>delete</mat-icon>
</div>

<h2 mat-dialog-title>Eliminar ruta</h2>

<mat-dialog-content>
  <p>¿Deseas eliminar esta ruta?</p>
  <p class="ruta-summary">
    <strong>{{ ruta.origen }} → {{ ruta.destino }}</strong>
    <span>{{ ruta.puntosReferencia }}</span>
  </p>
  <p class="ur-caption">
    Sus viajes programados futuros se cancelarán. El historial de viajes se conserva.
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" (click)="cancelar()">Cancelar</button>
  <button class="destructive-button" mat-flat-button type="button" (click)="confirmar()">
    Eliminar ruta
  </button>
</mat-dialog-actions>
