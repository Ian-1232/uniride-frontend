<div class="reportes-shell">
  <header class="feature-header">
    <a class="brand" routerLink="/reportes/resumen" aria-label="Ir al resumen de reportes">
      UniRide
    </a>

    <div class="header-actions">
      <span class="ur-status ur-status--info">Conductor</span>
      <button
        class="mobile-menu-button"
        mat-icon-button
        type="button"
        aria-label="Abrir navegación de reportes"
        [matMenuTriggerFor]="reportsMenu"
      >
        <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">menu</mat-icon>
      </button>
    </div>
  </header>

  <mat-menu #reportsMenu="matMenu">
    <a mat-menu-item routerLink="/reportes/resumen">
      <mat-icon aria-hidden="true">dashboard</mat-icon>
      <span>Resumen</span>
    </a>
    <a mat-menu-item routerLink="/reportes/frecuencia">
      <mat-icon aria-hidden="true">bar_chart</mat-icon>
      <span>Frecuencia semanal</span>
    </a>
    <a mat-menu-item routerLink="/reportes/rutas">
      <mat-icon aria-hidden="true">route</mat-icon>
      <span>Rutas frecuentes</span>
    </a>
  </mat-menu>

  <div class="reportes-layout">
    <nav class="reportes-navigation" aria-label="Secciones de reportes">
      <div class="navigation-heading">
        <p class="ur-label">REPORTES</p>
        <p class="navigation-title">Actividad personal</p>
      </div>

      <a routerLink="/reportes/resumen" routerLinkActive="is-active">
        <mat-icon aria-hidden="true">dashboard</mat-icon>
        <span>Resumen</span>
      </a>
      <a routerLink="/reportes/frecuencia" routerLinkActive="is-active">
        <mat-icon aria-hidden="true">bar_chart</mat-icon>
        <span>Frecuencia semanal</span>
      </a>
      <a routerLink="/reportes/rutas" routerLinkActive="is-active">
        <mat-icon aria-hidden="true">route</mat-icon>
        <span>Rutas frecuentes</span>
      </a>
      <span class="navigation-pending" aria-disabled="true">
        <mat-icon aria-hidden="true">picture_as_pdf</mat-icon>
        <span>Exportar historial</span>
        <small>Próximamente</small>
      </span>
    </nav>

    <section class="reportes-content" aria-live="polite">
      <router-outlet />
    </section>
  </div>
</div>
