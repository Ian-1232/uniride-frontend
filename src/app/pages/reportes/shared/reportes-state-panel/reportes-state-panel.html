<section
  class="state-panel"
  [class.state-panel--info]="tone() === 'info'"
  [class.state-panel--warning]="tone() === 'warning'"
  [class.state-panel--danger]="tone() === 'danger'"
  [class.state-panel--success]="tone() === 'success'"
  [class.state-panel--neutral]="tone() === 'neutral'"
  [attr.aria-busy]="loading()"
>
  @if (loading()) {
    <mat-spinner diameter="36" aria-label="Cargando información" />
  }

  <div class="state-copy">
    <h2>{{ title() }}</h2>
    <p>{{ message() }}</p>
  </div>

  @if (actionLabel()) {
    <button mat-stroked-button type="button" (click)="action.emit()">
      {{ actionLabel() }}
    </button>
  }
</section>
